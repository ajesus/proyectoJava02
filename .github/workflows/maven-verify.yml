name: Verificación Maven

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write
  attestations: write


jobs:
  build:
      name: Compilar y analizar proyecto
      runs-on: ubuntu-latest

      permissions:
        contents: read
        security-events: write
        actions: read
        id-token: write
        attestations: write

    steps:
      # DESCARGAR REPOSITORIO
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # PREPARAR ESTRUCTURA DE INFORMES DE SEGURIDAD
      - name: Preparar directorios de informes
        if: always()
        run: |
          mkdir -p security-reports/gitleaks
          mkdir -p security-reports/semgrep
          mkdir -p security-reports/trivy
          mkdir -p security-reports/codeql
          mkdir -p security-reports/dependency-check
          mkdir -p security-reports/zap
          mkdir -p security-reports/sbom
          mkdir -p security-reports/sonarqube
          mkdir -p security-reports/spotbugs

      # ANALIZAR SECRETOS CON GITLEAKS
      - name: Analizar secretos con Gitleaks
        if: always()
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_COMMENTS: false

      # GENERAR INFORME JSON GITLEAKS
      - name: Generar informe Gitleaks
        if: always()
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/path" \
            zricethezav/gitleaks:latest \
            git /path \
            --report-format json \
            --report-path /path/security-reports/gitleaks/gitleaks.json \
            --exit-code 0

      # ANALIZAR CODIGO CON SEMGREP
      - name: Instalar Semgrep
        if: always()
        run: pip install semgrep

      - name: Analizar código con Semgrep
        if: always()
        continue-on-error: true
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output security-reports/semgrep/semgrep.json

      # PUBLICAR INFORME SEMGREP
      - name: Publicar informe Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-semgrep
          path: security-reports/semgrep/semgrep.json
          if-no-files-found: warn
          retention-days: 30

      # ANALIZAR SEGURIDAD CON TRIVY
      - name: Analizar proyecto con Trivy
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret'
          format: 'json'
          output: 'security-reports/trivy/trivy.json'
          exit-code: '0'

      # INICIALIZAR CODEQL
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        continue-on-error: true
        with:
          languages: java-kotlin, actions
          build-mode: none
          queries: security-extended,security-and-quality

      # CONFIGURAR JAVA 8
      - name: Configurar Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # LIMPIAR PROYECTO
      - name: Limpiar proyecto
        continue-on-error: true
        run: mvn -B clean

      # COMPILAR
      - name: Compilar proyecto
        continue-on-error: true
        run: mvn -B compile

      # EJECUTAR JUNIT Y PREPARAR JACOCO
      - name: Ejecutar JUnit con JaCoCo
        continue-on-error: true
        run: mvn -B jacoco:prepare-agent test

      # EJECUTAR PRUEBAS DE INTEGRACION CON FAILSAFE
      - name: Ejecutar pruebas de integración con Failsafe
        if: always()
        continue-on-error: true
        run: mvn -B failsafe:integration-test failsafe:verify

      # GENERAR INFORME JACOCO
      - name: Generar informe JaCoCo
        if: always()
        continue-on-error: true
        run: mvn -B jacoco:report
        
      # ANALIZAR EFICACIA DE TESTS CON PIT
      - name: Analizar pruebas con PIT Mutation Testing
        if: always()
        continue-on-error: true
        run: mvn -B org.pitest:pitest-maven:mutationCoverage

      # ANALIZAR EFICACIA DE TESTS CON PIT
      - name: Analizar pruebas con PIT Mutation Testing
        if: always()
        continue-on-error: true
        run: |
          mvn -B org.pitest:pitest-maven:mutationCoverage \
            -DtargetClasses=TU_PAQUETE.* \
            -DtargetTests=TU_PAQUETE.* \
            -Dthreads=2 \
            -DoutputFormats=HTML,XML

      # GENERAR INFORME CHECKSTYLE
      - name: Generar informe Checkstyle
        if: always()
        continue-on-error: true
        run: mvn -B checkstyle:checkstyle

      # VALIDAR CHECKSTYLE
      - name: Validar Checkstyle
        if: always()
        continue-on-error: true
        run: mvn -B checkstyle:check

      # GENERAR INFORME SPOTBUGS
      - name: Generar informe SpotBugs
        if: always()
        continue-on-error: true
        run: mvn -B spotbugs:spotbugs

      # VALIDAR SPOTBUGS
      - name: Validar SpotBugs
        if: always()
        continue-on-error: true
        run: mvn -B spotbugs:check

      # ANALIZAR CON CODEQL
      - name: Analizar con CodeQL
        if: always()
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/language:java-kotlin-actions"

      # GENERAR JAR
      - name: Generar JAR
        if: always()
        continue-on-error: true
        run: mvn -B jar:jar

      # GENERAR ATTESTATION DEL JAR
      - name: Generar Artifact Attestation
        if: always() && hashFiles('target/*.jar') != ''
        uses: actions/attest@v4
        with:
          subject-path: target/*.jar

      # CONFIGURAR JAVA 17 PARA SONARQUBE
      - name: Configurar Java 17 para SonarQube
        if: always()
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ANALIZAR CON SONARQUBE CLOUD
      - name: Analizar código con SonarQube Cloud
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.projectKey=ajesus_proyectoJava02 \
            -Dsonar.organization=ajesus \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.java.jdkHome="$JAVA_HOME_8_X64" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # ANALIZAR DEPENDENCIAS CON OWASP
      - name: Analizar dependencias con OWASP Dependency-Check
        if: always()
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B org.owasp:dependency-check-maven:13.0.0:check -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      # GENERAR SBOM CON CYCLONEDX
      - name: Generar SBOM con CycloneDX
        if: always()
        continue-on-error: true
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DoutputFormat=json,xml -DoutputName=bom

      # ANALIZAR FUTURA APLICACION WEB CON OWASP ZAP
      - name: Analizar aplicación web con OWASP ZAP
        if: ${{ vars.ZAP_TARGET != '' }}
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.ZAP_TARGET }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: informe-zap

      # PUBLICAR JUNIT Y FAILSAFE
      - name: Publicar resultados JUnit y Failsafe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-junit-failsafe
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR JACOCO
      - name: Publicar informe JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR INFORME PIT
      - name: Publicar informe PIT Mutation Testing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pit-mutation-testing
          path: target/pit-reports/
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR CHECKSTYLE
      - name: Publicar informe Checkstyle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-checkstyle
          path: |
            target/site/checkstyle.html
            target/checkstyle-result.xml
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR SPOTBUGS
      - name: Publicar informe SpotBugs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-spotbugs
          path: |
            target/spotbugsXml.xml
            target/site/spotbugs/
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR INFORME OWASP
      - name: Publicar informe OWASP Dependency-Check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-owasp-dependency-check
          path: target/dependency-check-report.html
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR JAR
      - name: Publicar JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proyecto-java-jar
          path: target/*.jar
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR SBOM CYCLONEDX
      - name: Publicar SBOM CycloneDX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            target/bom.json
            target/bom.xml
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR REGISTRO DE EJECUCION
      - name: Publicar registro Maven
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-maven
          path: target/
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR INFORME PIT
      - name: Publicar informe PIT Mutation Testing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pit
          path: target/pit-reports/
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR INFORME TRIVY
      - name: Publicar informe Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-trivy
          path: security-reports/trivy/trivy.json
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR INFORME GITLEAKS
      - name: Publicar informe Gitleaks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-gitleaks
          path: security-reports/gitleaks/gitleaks.json
          if-no-files-found: warn
          retention-days: 30

  scorecard:
    name: Analizar seguridad con OpenSSF Scorecard
    needs: build
    if: always()
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Ejecutar OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Publicar resultados SARIF
        uses: actions/upload-artifact@v4
        with:
          name: resultados-openssf-scorecard
          path: results.sarif
          retention-days: 5

      - name: Publicar resultados en GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif