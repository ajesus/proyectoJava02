name: Verificación Maven

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build:
    name: Compilar y analizar proyecto
    runs-on: ubuntu-latest

    steps:

      # DESCARGAR REPOSITORIO
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ANALIZAR SECRETOS CON GITLEAKS
      - name: Analizar secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # INICIALIZAR CODEQL
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        continue-on-error: true
        with:
          languages: java-kotlin, actions
          build-mode: none
          queries: security-extended,security-and-quality

      # CONFIGURAR JAVA 8
      - name: Configurar Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # LIMPIAR PROYECTO
      - name: Limpiar proyecto
        continue-on-error: true
        run: mvn -B clean

      # COMPILAR
      - name: Compilar proyecto
        continue-on-error: true
        run: mvn -B compile

      # EJECUTAR JUNIT Y PREPARAR JACOCO
      - name: Ejecutar JUnit con JaCoCo
        continue-on-error: true
        run: mvn -B jacoco:prepare-agent test

      # GENERAR INFORME JACOCO
      - name: Generar informe JaCoCo
        if: always()
        continue-on-error: true
        run: mvn -B jacoco:report

      # GENERAR INFORME CHECKSTYLE
      - name: Generar informe Checkstyle
        if: always()
        continue-on-error: true
        run: mvn -B checkstyle:checkstyle

      # VALIDAR CHECKSTYLE
      - name: Validar Checkstyle
        if: always()
        continue-on-error: true
        run: mvn -B checkstyle:check

      # GENERAR INFORME SPOTBUGS
      - name: Generar informe SpotBugs
        if: always()
        continue-on-error: true
        run: mvn -B spotbugs:spotbugs

      # VALIDAR SPOTBUGS
      - name: Validar SpotBugs
        if: always()
        continue-on-error: true
        run: mvn -B spotbugs:check

      # ANALIZAR CON CODEQL
      - name: Analizar con CodeQL
        if: always()
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/language:java-kotlin-actions"

      # GENERAR JAR
      - name: Generar JAR
        if: always()
        continue-on-error: true
        run: mvn -B jar:jar

      # CONFIGURAR JAVA 17 PARA SONARQUBE
      - name: Configurar Java 17 para SonarQube
        if: always()
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ANALIZAR CON SONARQUBE CLOUD
      - name: Analizar código con SonarQube Cloud
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.projectKey=ajesus_proyectoJava02 \
            -Dsonar.organization=ajesus \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.java.jdkHome="$JAVA_HOME_8_X64" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # ANALIZAR DEPENDENCIAS CON OWASP
      - name: Analizar dependencias con OWASP Dependency-Check
        if: always()
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B org.owasp:dependency-check-maven:13.0.0:check -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      # PUBLICAR JUNIT
      - name: Publicar resultados JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-junit
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR JACOCO
      - name: Publicar informe JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR CHECKSTYLE
      - name: Publicar informe Checkstyle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-checkstyle
          path: |
            target/site/checkstyle.html
            target/checkstyle-result.xml
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR SPOTBUGS
      - name: Publicar informe SpotBugs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-spotbugs
          path: |
            target/spotbugsXml.xml
            target/site/spotbugs/
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR INFORME OWASP
      - name: Publicar informe OWASP Dependency-Check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-owasp-dependency-check
          path: target/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR INFORME OWASP
      - name: Publicar informe OWASP Dependency-Check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-owasp-dependency-check
          path: target/dependency-check-report.html
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR JAR
      - name: Publicar JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proyecto-java-jar
          path: target/*.jar
          if-no-files-found: warn
          retention-days: 30

      # PUBLICAR REGISTRO DE EJECUCION
      - name: Publicar registro Maven
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-maven
          path: target/
          if-no-files-found: warn
          retention-days: 30